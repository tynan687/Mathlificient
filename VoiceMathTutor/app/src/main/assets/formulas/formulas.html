<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + env() insets below: the app draws edge-to-edge on
       Android 15 (targetSdk 35), so without this the sticky search sits under
       the status bar and the last card under the nav bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Formula Sheet</title>
  <link rel="stylesheet" href="katex/katex.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --pad: 14px;
      --top-inset: env(safe-area-inset-top, 0px);
      --bottom-inset: env(safe-area-inset-bottom, 0px);
    }
    body { font-family: system-ui, sans-serif; margin: 0;
      padding: 0 var(--pad) calc(24px + var(--bottom-inset));
      background: Canvas; color: CanvasText; font-size: 16px; }

    /* ---- Sticky header: search + count + group jump ---- */
    header { position: sticky; top: 0; z-index: 3; background: Canvas;
      padding: calc(8px + var(--top-inset)) 0 8px;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
    .searchrow { display: flex; gap: 8px; align-items: center; }
    #search { flex: 1; min-width: 0; box-sizing: border-box; padding: 13px 12px;
      font-size: 16px; border-radius: 10px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    /* 48px minimum touch target — the old buttons were ~37px. */
    #clear, #close { min-width: 48px; min-height: 48px; border-radius: 10px;
      font-size: 18px; line-height: 1; flex: 0 0 auto; }
    #count { font-size: 12px; opacity: 0.65; padding: 6px 2px 0; }
    /* Horizontal chip strip to jump between the 15 groups. */
    .groupbar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .groupbar::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; padding: 10px 14px; border-radius: 999px; font-size: 13px;
      min-height: 44px; white-space: nowrap; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      background: Canvas; color: CanvasText; }

    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6;
      margin: 20px 0 6px; scroll-margin-top: 132px; }
    .f { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
    /* The whole card is a tap target, so it needs to acknowledge the tap. */
    .f:active { background: color-mix(in srgb, CanvasText 6%, transparent); }
    .f .name { font-weight: 600; margin-bottom: 6px; display: flex;
      justify-content: space-between; align-items: baseline; gap: 8px; }
    .f .name .label { min-width: 0; }
    .f .name .badge { font-size: 11px; font-weight: 400; opacity: 0.6; white-space: nowrap;
      flex: 0 0 auto; }
    .f .tex { overflow-x: auto; padding: 4px 0; font-size: 17px; }

    .solver { display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed color-mix(in srgb, CanvasText 20%, transparent); }
    .f.open .solver { display: block; }
    /* Grid, not a flex-wrap of fixed 100px boxes — that could only ever fit two
       per row, so every 3+ variable solver came out ragged. */
    .solver .inputs { display: grid; gap: 10px; margin-bottom: 10px;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .solver .field { min-width: 0; }
    .solver label { font-size: 12px; opacity: 0.8; display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .solver input { width: 100%; box-sizing: border-box; padding: 12px 10px;
      border-radius: 8px; font-size: 16px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    .results { margin: 8px 0; font-size: 16px; }
    .results div { padding: 3px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 48px; padding: 12px 16px; border-radius: 9px; font-size: 14px;
      cursor: pointer; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    button:active { background: color-mix(in srgb, CanvasText 10%, transparent); }
    button.primary { background: #4F7DF7; border-color: #4F7DF7; color: #fff; }
    .copied { color: #2FB65D; font-size: 13px; margin-left: 4px; }
    .hidden { display: none !important; }
    .empty { opacity: 0.6; font-size: 14px; padding: 24px 2px; }
  </style>
</head>
<body>
  <header>
    <div class="searchrow">
      <input id="search" placeholder="Search formulas…" enterkeyhint="search">
      <button id="clear" title="Clear search" class="hidden">✕</button>
      <button id="close" title="Close">⌄</button>
    </div>
    <div class="groupbar" id="groupbar"></div>
    <div id="count"></div>
  </header>
  <div id="list"></div>
  <div class="empty hidden" id="empty">No formulas match that search.</div>
  <script src="katex/katex.min.js"></script>
  <script src="formulas-data.js"></script>
  <script src="formulas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice</title>
  <link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css" id="katexCss">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px;
      background: Canvas; color: CanvasText; font-size: 15px; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    select { padding: 8px; border-radius: 8px; font-size: 14px; flex: 1; min-width: 140px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    button { padding: 9px 14px; border-radius: 9px; font-size: 14px; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    button.primary { background: #4F7DF7; border-color: #4F7DF7; color: #fff; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
    .src { font-size: 12px; opacity: 0.6; margin-bottom: 6px; }
    .q { font-size: 18px; overflow-x: auto; padding: 6px 0; }
    .step { padding: 6px 0; overflow-x: auto;
      border-top: 1px dashed color-mix(in srgb, CanvasText 15%, transparent); }
    .answer { font-weight: 600; padding-top: 8px; overflow-x: auto; }
    .formulas { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 12px; padding: 10px 14px; margin: 10px 0;
      background: color-mix(in srgb, CanvasText 4%, transparent); }
    .flabel { font-size: 12px; opacity: 0.7; margin-bottom: 4px; font-weight: 600; }
    .frow { padding: 3px 0; overflow-x: auto; }
    .vizbar { width: 100%; text-align: left; margin: 10px 0 0; }
    .vizwrap { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 12px; padding: 8px; margin: 8px 0; }
    .vizwrap canvas { width: 100%; height: 280px; display: block; }
    .hidden { display: none !important; }
    .hint { opacity: 0.65; font-size: 13px; }

    .toolbar-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
    .tlabel { font-size: 13px; opacity: 0.7; margin-right: 2px; }
    .swatches { display: flex; gap: 6px; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
      display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .swatch.selected { border: 3px solid CanvasText; }
    .eraser-swatch { font-size: 14px; }
    .spacer { flex: 1; }
    #inkCanvasWrap { border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 12px; overflow: hidden; margin-top: 4px; height: 360px; }
    #inkCanvasWrap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #paperCustom { width: 34px; height: 26px; padding: 0; border-radius: 6px; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); background: transparent; }

    .quizbar { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
    #quizProgress { font-size: 13px; opacity: 0.8; }
    .grading { display: flex; gap: 8px; margin: 8px 0; }
    #gotIt { border-color: #2E7D32; color: #2E7D32; }
    #missedIt { border-color: #C62828; color: #C62828; }
    .missed-item { border-top: 1px dashed color-mix(in srgb, CanvasText 15%, transparent);
      padding: 8px 0; }

    /* Multiple choice. The options are <div>s, not <button>s, on purpose: the
       Android studio injects `select,button{...!important}` on every paper
       change, which would repaint the right/wrong states away. */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .mcq-option { border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      border-radius: 10px; padding: 12px 14px; min-height: 46px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-align: center;
      overflow-x: auto; }
    .mcq-option:hover:not(.locked) { border-color: #4F7DF7; }
    .mcq-option:focus-visible { outline: 2px solid #4F7DF7; outline-offset: 2px; }
    .mcq-option.locked { cursor: default; }
    /* State via box-shadow as well as border, so it survives applyPaper. */
    .mcq-option.correct { border-color: #2E7D32; box-shadow: inset 0 0 0 2px #2E7D32; }
    .mcq-option.wrong { border-color: #C62828; box-shadow: inset 0 0 0 2px #C62828; }
    .mcq-feedback { font-size: 13.5px; margin: 6px 0 10px; line-height: 1.45; }
    .mcq-feedback.good { color: #2E7D32; }
    .mcq-feedback.bad { color: #C62828; }
    #modeNote { font-size: 12.5px; opacity: 0.7; margin: 4px 0 8px; }

    details#inkPanel { margin-top: 10px; }
    details#inkPanel > summary { cursor: pointer; font-size: 13.5px; opacity: 0.8;
      padding: 6px 0; }
  </style>
</head>
<body>
  <div class="bar">
    <select id="topic"></select>
    <button class="primary" id="newQ">New question</button>
  </div>
  <div class="quizbar">
    <select id="answerMode" title="How you answer">
      <option value="self">Work it out</option>
      <option value="mcq">Multiple choice</option>
    </select>
    <select id="quizCount">
      <option value="5">Quiz: 5 questions</option>
      <option value="10">Quiz: 10 questions</option>
      <option value="20">Quiz: 20 questions</option>
    </select>
    <button id="startQuiz">▶ Start quiz</button>
    <button id="printWorksheet">🖨 Worksheet</button>
    <span id="quizProgress" class="hidden"></span>
  </div>
  <div id="modeNote" class="hidden"></div>
  <div class="card">
    <div class="src" id="src"></div>
    <div class="q" id="question"><span class="hint">Press "New question" — work it on paper,
      then reveal the steps one at a time.</span></div>
    <div id="steps"></div>
    <div class="answer hidden" id="answer"></div>
  </div>
  <div class="choices hidden" id="choices"></div>
  <div class="mcq-feedback hidden" id="mcqFeedback"></div>
  <div class="formulas hidden" id="formulas"></div>
  <button class="vizbar hidden" id="vizBar">📈 Visual available — tap to show</button>
  <div class="vizwrap hidden" id="vizWrap"><canvas id="viz"></canvas></div>
  <div class="bar">
    <button id="nextStep" disabled>Show next step</button>
    <button id="showAnswer" disabled>Show answer</button>
    <button id="copyQ" disabled>Copy LaTeX</button>
    <button class="primary hidden" id="mcqNext">Next question →</button>
  </div>
  <div class="grading hidden" id="grading">
    <button id="gotIt">✓ Got it</button>
    <button id="missedIt">✗ Missed it</button>
  </div>
  <div class="card hidden" id="quizSummary"></div>

  <!-- The toolbars live inside the <details> with the canvas: they control
       something that isn't on screen otherwise. Collapsing takes ~460px off the
       page, which is what makes room for the option grid without pushing the
       question off screen at the window's minimum height. No extra wiring is
       needed — measured, Chromium leaves the canvas's own box alone while the
       panel is shut, and strokes are in world coordinates either way. -->
  <details id="inkPanel" open>
    <summary>✏️ Working space</summary>
    <div class="toolbar-row">
      <span class="tlabel">Ink →</span>
      <div class="swatches" id="inkSwatches"></div>
      <div class="swatch eraser-swatch" id="eraserSwatch">⌫</div>
      <div class="spacer"></div>
      <button id="inkZoomOut" title="Zoom out">−</button>
      <button id="inkZoomIn" title="Zoom in">+</button>
      <button id="inkZoomReset" class="hidden" title="Reset view">⤾ 1:1</button>
      <button id="inkSave" title="Save drawing as PNG">💾 Save</button>
      <button id="inkUndo">Undo</button>
      <button id="inkClear">Clear</button>
    </div>
    <div class="toolbar-row">
      <span class="tlabel">Paper →</span>
      <div class="swatches" id="paperSwatches"></div>
      <input type="color" id="paperCustom" value="#ffffff" title="Custom paper colour">
    </div>
    <div id="inkCanvasWrap"><canvas id="inkCanvas"></canvas></div>
  </details>

  <script src="../../node_modules/katex/dist/katex.min.js" id="katexJs"></script>
  <script src="../practice-skills.js"></script>
  <script src="../practice-data.js" id="practiceData"></script>
  <script src="../practice-viz.js"></script>
  <script src="../practice-prof.js"></script>
  <script src="../practice-store.js"></script>
  <script src="../practice-mcq.js"></script>
  <script src="practice.js"></script>
  <script src="../practice-ink.js"></script>
  <script src="../practice-quiz.js"></script>
</body>
</html>

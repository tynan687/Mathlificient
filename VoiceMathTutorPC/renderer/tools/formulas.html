<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Formula Sheet</title>
  <link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 16px;
      background: Canvas; color: CanvasText; font-size: 14px; }
    #search { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
      border-radius: 8px; margin-bottom: 12px; position: sticky; top: 8px; z-index: 2;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6;
      margin: 18px 0 6px; }
    .f { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 10px; padding: 10px 12px; margin: 8px 0; cursor: pointer; }
    .f:hover { background: color-mix(in srgb, CanvasText 6%, transparent); }
    .f .name { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .f .name .badge { font-size: 11px; font-weight: 400; opacity: 0.6; }
    .f .tex { overflow-x: auto; padding: 2px 0; }
    .solver { display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed color-mix(in srgb, CanvasText 20%, transparent); }
    .f.open .solver { display: block; }
    .solver .inputs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .solver label { font-size: 12px; opacity: 0.8; display: block; }
    .solver input { width: 110px; padding: 6px; border-radius: 6px; font-size: 13px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; }
    .results { margin: 6px 0; font-size: 14px; }
    .results div { padding: 2px 0; }
    .results b { font-variant-numeric: tabular-nums; }
    button { padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: Canvas; color: CanvasText; margin-right: 6px; }
    button.primary { background: #4F7DF7; border-color: #4F7DF7; color: #fff; }
    .copied { color: #2FB65D; font-size: 12px; margin-left: 4px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <input id="search" placeholder="Search formulas… (e.g. quadratic, cosine rule, integral)">
  <div id="list"></div>
  <script src="../theme.js"></script>
  <script src="../../node_modules/katex/dist/katex.min.js"></script>
  <script src="../formulas-data.js"></script>
  <script src="formulas.js"></script>
</body>
</html>

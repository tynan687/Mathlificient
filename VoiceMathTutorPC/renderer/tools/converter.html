<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unit &amp; Constant Converter</title>
  <link rel="stylesheet" href="../app.css">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 16px;
      background: var(--bg); color: var(--fg); font-size: 14px; }
    h2 { font-size: 15px; margin: 14px 0 6px; }
    select, input { padding: 7px 8px; border-radius: 7px; font-size: 14px;
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
      background: var(--bg); color: var(--fg); }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    .row input { flex: 1; min-width: 0; }
    .out { font-size: 20px; font-weight: 600; margin: 8px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td { padding: 4px 6px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .k { cursor: pointer; }
    .k:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  </style>
</head>
<body>
  <h2>Convert</h2>
  <div class="row">
    <select id="quantity"></select>
  </div>
  <div class="row">
    <input id="value" type="number" value="1" step="any">
    <select id="from"></select>
    <span>→</span>
    <select id="to"></select>
  </div>
  <div class="out" id="result">—</div>

  <h2>Physical constants <span style="opacity:.6;font-weight:400;font-size:12px">(click to copy)</span></h2>
  <table id="constants"></table>

  <script src="../theme.js"></script>
  <script>
    // Units expressed as a factor to the SI base for each quantity.
    const QUANTITIES = {
      Length: { m: 1, cm: 0.01, mm: 0.001, km: 1000, inch: 0.0254, ft: 0.3048, yd: 0.9144, mile: 1609.344 },
      Mass: { kg: 1, g: 0.001, mg: 1e-6, tonne: 1000, lb: 0.45359237, oz: 0.028349523 },
      Force: { N: 1, kN: 1000, lbf: 4.4482216, kgf: 9.80665 },
      Energy: { J: 1, kJ: 1000, cal: 4.184, kcal: 4184, Wh: 3600, kWh: 3.6e6, eV: 1.602176634e-19 },
      Pressure: { Pa: 1, kPa: 1000, MPa: 1e6, bar: 1e5, atm: 101325, psi: 6894.757, mmHg: 133.322 },
      Power: { W: 1, kW: 1000, MW: 1e6, hp: 745.6999 },
      Angle: { rad: 1, deg: Math.PI / 180, grad: Math.PI / 200, rev: 2 * Math.PI },
      Time: { s: 1, ms: 0.001, min: 60, h: 3600, day: 86400 },
    };
    const TEMP = ['Temperature'];

    const CONSTANTS = [
      ['Speed of light c', '2.99792458×10⁸ m/s'],
      ['Gravitational g', '9.80665 m/s²'],
      ['Gravitational G', '6.67430×10⁻¹¹ N·m²/kg²'],
      ['Planck h', '6.62607015×10⁻³⁴ J·s'],
      ['Reduced Planck ħ', '1.054571817×10⁻³⁴ J·s'],
      ['Elementary charge e', '1.602176634×10⁻¹⁹ C'],
      ['Electron mass', '9.1093837015×10⁻³¹ kg'],
      ['Proton mass', '1.67262192369×10⁻²⁷ kg'],
      ['Avogadro Nₐ', '6.02214076×10²³ /mol'],
      ['Boltzmann k', '1.380649×10⁻²³ J/K'],
      ['Gas constant R', '8.314462618 J/(mol·K)'],
      ['Permittivity ε₀', '8.8541878128×10⁻¹² F/m'],
      ['Permeability μ₀', '1.25663706212×10⁻⁶ H/m'],
      ['Stefan–Boltzmann σ', '5.670374419×10⁻⁸ W/(m²·K⁴)'],
      ['Standard atm', '101325 Pa'],
    ];

    const quantitySel = document.getElementById('quantity');
    const fromSel = document.getElementById('from');
    const toSel = document.getElementById('to');
    const valueEl = document.getElementById('value');
    const resultEl = document.getElementById('result');

    [...Object.keys(QUANTITIES), ...TEMP].forEach((q) => {
      const o = document.createElement('option'); o.value = q; o.textContent = q;
      quantitySel.appendChild(o);
    });

    function fillUnits() {
      const q = quantitySel.value;
      fromSel.innerHTML = ''; toSel.innerHTML = '';
      const units = q === 'Temperature' ? ['°C', '°F', 'K'] : Object.keys(QUANTITIES[q]);
      units.forEach((u) => {
        fromSel.appendChild(new Option(u, u));
        toSel.appendChild(new Option(u, u));
      });
      if (units.length > 1) toSel.selectedIndex = 1;
      convert();
    }

    function toKelvin(v, u) { return u === '°C' ? v + 273.15 : u === '°F' ? (v - 32) * 5 / 9 + 273.15 : v; }
    function fromKelvin(k, u) { return u === '°C' ? k - 273.15 : u === '°F' ? (k - 273.15) * 9 / 5 + 32 : k; }

    function convert() {
      const q = quantitySel.value;
      const v = parseFloat(valueEl.value);
      if (isNaN(v)) { resultEl.textContent = '—'; return; }
      let out;
      if (q === 'Temperature') {
        out = fromKelvin(toKelvin(v, fromSel.value), toSel.value);
      } else {
        out = v * QUANTITIES[q][fromSel.value] / QUANTITIES[q][toSel.value];
      }
      const rounded = Math.abs(out) < 1e-4 || Math.abs(out) >= 1e6
        ? out.toExponential(6) : parseFloat(out.toPrecision(8));
      resultEl.textContent = `${rounded} ${toSel.value}`;
    }

    quantitySel.addEventListener('change', fillUnits);
    [fromSel, toSel, valueEl].forEach((el) => el.addEventListener('input', convert));

    const table = document.getElementById('constants');
    CONSTANTS.forEach(([name, val]) => {
      const tr = document.createElement('tr');
      tr.className = 'k';
      tr.innerHTML = `<td>${name}</td><td>${val}</td>`;
      tr.addEventListener('click', () => navigator.clipboard.writeText(val).catch(() => {}));
      table.appendChild(tr);
    });

    fillUnits();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>menu</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif; }
    .menu {
      background: #232634; color: #fff; border-radius: 12px; padding: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45); user-select: none;
    }
    .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 8px; font-size: 13.5px; cursor: pointer; }
    .item:hover { background: #3a3f52; }
    .item .ico { width: 20px; text-align: center; font-size: 15px; }
    .sep { height: 1px; background: rgba(255,255,255,0.12); margin: 5px 8px; }
    .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
      opacity: 0.5; padding: 4px 12px 2px; }
  </style>
</head>
<body>
  <div class="menu">
    <div class="grp">Tutor</div>
    <div class="item" data-action="ask"><span class="ico">💡</span>Ask about my screen</div>
    <div class="item" data-action="snapshot"><span class="ico">📸</span>Silent snapshot</div>
    <div class="item" data-action="practice"><span class="ico">🎯</span>New practice problem</div>
    <div class="item" data-prompt="web"><span class="ico">🌐</span>Web search…</div>
    <div class="item" data-prompt="textbook"><span class="ico">📚</span>Search my textbooks…</div>
    <div class="sep"></div>
    <div class="grp">Session</div>
    <div class="item" data-action="watch"><span class="ico">👁️</span>Toggle watch mode</div>
    <div class="item" data-action="mute"><span class="ico">🔇</span>Toggle mute</div>
    <div class="sep"></div>
    <div class="grp">Tools</div>
    <div class="item" data-action="converter"><span class="ico">📐</span>Unit &amp; constant converter</div>
    <div class="item" data-action="timer"><span class="ico">⏱️</span>Focus timer</div>
    <div class="item" data-action="ambient"><span class="ico">🌧</span>Ambient sound</div>
    <div class="item" data-action="formulas"><span class="ico">🧮</span>Formula cheat-sheet</div>
    <div class="item" data-action="symbols"><span class="ico">∫</span>Symbols &amp; how to read them</div>
    <div class="item" data-action="progress"><span class="ico">📊</span>My progress</div>
    <div class="item" data-action="chat"><span class="ico">📝</span>Worked examples</div>
  </div>
  <script src="theme.js"></script>
  <script src="menu.js"></script>
</body>
</html>

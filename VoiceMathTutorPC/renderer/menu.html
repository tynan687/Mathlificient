<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>menu</title>
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif; }
    .menu {
      /* Tokens, not a fixed dark panel. This popup floats over the desktop, so
         it has to follow the theme like everything else — it only ever did in
         sepia, and only because theme.js used to inject an override for it. */
      background: var(--bg); color: var(--fg); border-radius: var(--radius-lg); padding: 6px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45); user-select: none;
    }
    .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 8px; font-size: 13.5px; cursor: pointer; }
    .item:hover { background: var(--hover); }
    .item .ico { width: 20px; text-align: center; font-size: 15px; }
    .sep { height: 1px; background: var(--line); margin: 5px 8px; }
    .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
      opacity: 0.5; padding: 4px 12px 2px; }
  </style>
</head>
<body>
  <div class="menu"></div>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
  <script src="menu.js"></script>
</body>
</html>
